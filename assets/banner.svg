<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d1426"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="440" fill="url(#fade)"/></mask>
  </defs>

  <!-- background -->
  <rect width="1280" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="20" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1280" height="440" rx="20" fill="url(#glow1)"/>
  <rect width="1280" height="440" rx="20" fill="url(#glow2)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.35">
    <path d="M1280 412 H1150 L1130 398 H1040"/>
    <path d="M1280 424 H980 L962 410 H880"/>
    <path d="M1280 60 H1210 L1185 85 H1130"/>
  </g>
  <g fill="#22d3ee" opacity="0.6">
    <circle cx="1040" cy="398" r="3.5"/><circle cx="880" cy="410" r="3.5"/><circle cx="1130" cy="85" r="3.5"/>
  </g>

  <!-- status pill -->
  <g transform="translate(64 58)">
    <rect width="290" height="30" rx="15" fill="#0f172a" stroke="#1f2a44"/>
    <circle cx="18" cy="15" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="20" font-size="13" fill="#94a3b8" font-family="Consolas, 'SF Mono', Menlo, monospace">India · building in the open</text>
  </g>

  <!-- name + role -->
  <text x="62" y="148" font-size="60" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Anand Kumar Maurya</text>
  <text x="64" y="192" font-size="24" font-weight="600" fill="url(#accent)">AI · IoT · Edge AI · Backend Engineer</text>
  <text x="64" y="228" font-size="18" fill="#94a3b8" font-style="italic">“From field signals to intelligent systems.”</text>

  <!-- stats -->
  <g font-family="Consolas, 'SF Mono', Menlo, monospace">
    <g transform="translate(64 262)">
      <rect width="136" height="70" rx="12" fill="#0f172a" stroke="#1f2a44"/>
      <text x="16" y="36" font-size="26" font-weight="700" fill="#22d3ee">25+</text>
      <text x="16" y="56" font-size="12" fill="#64748b">open-source repos</text>
    </g>
    <g transform="translate(212 262)">
      <rect width="136" height="70" rx="12" fill="#0f172a" stroke="#1f2a44"/>
      <text x="16" y="36" font-size="26" font-weight="700" fill="#818cf8">6</text>
      <text x="16" y="56" font-size="12" fill="#64748b">Proxmox nodes</text>
    </g>
    <g transform="translate(360 262)">
      <rect width="136" height="70" rx="12" fill="#0f172a" stroke="#1f2a44"/>
      <text x="16" y="36" font-size="26" font-weight="700" fill="#a78bfa">5</text>
      <text x="16" y="56" font-size="12" fill="#64748b">MCP servers</text>
    </g>
    <g transform="translate(508 262)">
      <rect width="136" height="70" rx="12" fill="#0f172a" stroke="#1f2a44"/>
      <text x="16" y="36" font-size="26" font-weight="700" fill="#c084fc">4+</text>
      <text x="16" y="56" font-size="12" fill="#64748b">years building</text>
    </g>
  </g>

  <!-- links -->
  <text x="64" y="384" font-size="14" fill="#64748b" font-family="Consolas, 'SF Mono', Menlo, monospace">
    <tspan fill="#22d3ee">→</tspan> anandmaurya.in  <tspan fill="#334155">│</tspan>  github.com/anand34577  <tspan fill="#334155">│</tspan>  medium.com/@anand34577
  </text>

  <!-- terminal card -->
  <g transform="translate(740 56)">
    <rect width="476" height="328" rx="14" fill="#0b1120" fill-opacity="0.92" stroke="#25304d"/>
    <path d="M0 14 A14 14 0 0 1 14 0 H462 A14 14 0 0 1 476 14 V40 H0 Z" fill="#111a2e"/>
    <circle cx="22" cy="20" r="6" fill="#f87171"/>
    <circle cx="42" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="62" cy="20" r="6" fill="#34d399"/>
    <text x="238" y="25" font-size="12" fill="#64748b" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace">anand@edge-rk3588: ~</text>

    <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14">
      <text x="22" y="72"><tspan fill="#34d399">❯</tspan><tspan fill="#e2e8f0"> cat stack.yml</tspan></text>
      <text x="22" y="102"><tspan fill="#818cf8">backend:</tspan><tspan fill="#cbd5e1">  Java · Spring Boot · Postgres</tspan></text>
      <text x="22" y="124"><tspan fill="#818cf8">  langs:</tspan><tspan fill="#cbd5e1">  Go · Kotlin · TypeScript · C++</tspan></text>
      <text x="22" y="150"><tspan fill="#22d3ee">iot:</tspan><tspan fill="#cbd5e1">      MQTT · RFID · ANPR · CAN · UWB</tspan></text>
      <text x="22" y="176"><tspan fill="#c084fc">ai:</tspan><tspan fill="#cbd5e1">       Spring AI · MCP · RAG · Llama</tspan></text>
      <text x="22" y="202"><tspan fill="#f472b6">edge:</tspan><tspan fill="#cbd5e1">     RK3588 · RK3576 · Raspberry Pi</tspan></text>
      <text x="22" y="228"><tspan fill="#fbbf24">lab:</tspan><tspan fill="#cbd5e1">      6× Proxmox · Docker · OpenWrt</tspan></text>
      <text x="22" y="262"><tspan fill="#34d399">❯</tspan><tspan fill="#e2e8f0"> uptime</tspan></text>
      <text x="22" y="288"><tspan fill="#cbd5e1">homelab </tspan><tspan fill="#64748b">· 10 endpoints · </tspan><tspan fill="#22d3ee">all up</tspan></text>
      <rect x="22" y="300" width="9" height="16" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- bottom accent bar -->
  <rect x="0" y="434" width="1280" height="6" fill="url(#accent)" opacity="0.9"/>
</svg>
